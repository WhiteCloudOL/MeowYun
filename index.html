<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="清蒸云鸭 RSS" href="/rss.xml" />
    <link rel="canonical" href="https://meowyun.cn/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcf9fd" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="清蒸云鸭的个人主页，记录 QQ 机器人、Minecraft 服务端工具、开源项目与中文技术文档。"
    />
    <meta
      name="keywords"
      content="清蒸云鸭,MeowYunCN,WhiteCloudOL,QQ机器人,Minecraft,开源,技术文档"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="清蒸云鸭" />
    <meta property="og:title" content="清蒸云鸭 · 个人主页" />
    <meta
      property="og:description"
      content="记录 QQ 机器人、Minecraft 服务端工具、开源项目与中文技术文档。"
    />
    <meta property="og:url" content="https://meowyun.cn/" />
    <meta property="og:image" content="https://meowyun.cn/og-card.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="清蒸云鸭 · 个人主页" />
    <meta
      name="twitter:description"
      content="记录 QQ 机器人、Minecraft 服务端工具、开源项目与中文技术文档。"
    />
    <meta name="twitter:image" content="https://meowyun.cn/og-card.webp" />
    <script>
      // 在 Vue 启动前解析主题，避免页面首次绘制时出现明暗闪烁。
      let preference = 'system'
      try {
        preference = localStorage.getItem('meowyun-theme') || 'system'
        const atmosphere = localStorage.getItem('meowyun-atmosphere')
        document.documentElement.dataset.atmosphere =
          atmosphere === 'sky' || atmosphere === 'mint' ? atmosphere : 'cream'
        document.documentElement.dataset.scenery = String(
          localStorage.getItem('meowyun-scenery') !== 'false',
        )
      } catch {
        /* 禁用存储时跟随系统。 */
      }
      const theme =
        preference === 'light' || preference === 'dark'
          ? preference
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
      document.documentElement.dataset.theme = theme
      document.querySelector('meta[name="theme-color"]').content =
        theme === 'dark' ? '#222536' : '#fcf9fd'
    </script>
    <title>清蒸云鸭 · 个人主页</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
